<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root { --bg:#0b1220; --panel:#121b2e; --line:#223152; --text:#e6edf7; --dim:#8a9bb8; --accent:#3ad1ff; --me:#1c3b5a; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font:16px/1.5 system-ui, Segoe UI, Roboto, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:18px; margin:0; letter-spacing:3px; color:var(--accent); flex:1; }
  header button { background:none; border:1px solid var(--line); color:var(--dim); padding:6px 10px; border-radius:8px; cursor:pointer; }
  header button.on { color:var(--accent); border-color:var(--accent); }
  #orbwrap { display:flex; flex-direction:column; align-items:center; padding:14px 0 4px; }
  #orb { --c:#3ad1ff; --spin:14s; --beat:3s; position:relative; width:116px; height:116px; }
  #orb i { position:absolute; border-radius:50%; border:2px solid transparent; transition:border-color .4s; }
  #orb i:nth-child(1) { inset:0; border-top-color:var(--c); border-bottom-color:var(--c); opacity:.9;
                        animation:spin var(--spin) linear infinite; }
  #orb i:nth-child(2) { inset:13px; border-left-color:var(--c); border-right-color:var(--c); opacity:.7;
                        animation:spin calc(var(--spin) * .7) linear infinite reverse; }
  #orb i:nth-child(3) { inset:27px; border:2px dashed var(--c); opacity:.5;
                        animation:spin calc(var(--spin) * 1.6) linear infinite; }
  #orb b { position:absolute; inset:41px; border-radius:50%;
           background:radial-gradient(circle, #fff 0%, var(--c) 45%, transparent 75%);
           box-shadow:0 0 26px var(--c); animation:breathe var(--beat) ease-in-out infinite; }
  #orb.listening { --c:#5dff9d; --spin:6s;  --beat:.9s; }
  #orb.thinking  { --c:#ffb84d; --spin:1.6s; --beat:1.2s; }
  #orb.speaking  { --c:#3ad1ff; --spin:5s;  --beat:.5s; }
  #orbLabel { color:var(--dim); font-size:12px; letter-spacing:3px; text-transform:uppercase; margin-top:10px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform:scale(.88); opacity:.75; } 50% { transform:scale(1.12); opacity:1; } }
  @media (prefers-reduced-motion: reduce) { #orb i, #orb b { animation:none; } }
  @media (max-height:560px) { #orbwrap { display:none; } }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(720px, 90%); padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); }
  .ai { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .sys { align-self:center; color:var(--dim); font-size:13px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  input[type=text], input[type=password] { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text);
         padding:10px 12px; border-radius:10px; font:inherit; }
  form button { background:var(--accent); color:#04202b; border:0; padding:0 16px; border-radius:10px; font-weight:600; cursor:pointer; }
  form button.mic { background:var(--panel); color:var(--accent); border:1px solid var(--accent); }
  form button.mic.rec { background:#ff4d6d; color:#fff; border-color:#ff4d6d; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:14px; width:min(480px, 92vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog label { display:block; margin:12px 0 4px; color:var(--dim); font-size:13px; }
  dialog input, dialog textarea { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
         padding:8px 10px; border-radius:8px; font:inherit; }
  dialog textarea { min-height:90px; }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .row button { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  .row button.primary { background:var(--accent); color:#04202b; border:0; font-weight:600; }
  small { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <button id="speakBtn" title="Speak replies aloud">Voice: off</button>
  <button id="memBtn">Memory</button>
  <button id="setBtn">Settings</button>
</header>

<div id="orbwrap">
  <div id="orb" class="idle"><i></i><i></i><i></i><b></b></div>
  <div id="orbLabel">Standing by</div>
</div>

<div id="log"></div>

<form id="form">
  <button type="button" class="mic" id="micBtn" title="Talk to Jarvis">Mic</button>
  <input type="text" id="box" placeholder="Talk to Jarvis..." autocomplete="off">
  <button type="submit">Send</button>
</form>

<dialog id="settings">
  <h3 style="margin-top:0">Settings</h3>
  <label>API key (stored only in this browser)</label>
  <input type="password" id="sKey" placeholder="paste your key">
  <label>Model</label>
  <input type="text" id="sModel">
  <label>API base URL (any OpenAI-compatible service)</label>
  <input type="text" id="sBase">
  <label>Backup models (tried in order if the main one is busy; separate with commas)</label>
  <input type="text" id="sFallbacks">
  <small>Default is Google Gemini. Change the model, base URL and backups to switch provider later.</small>
  <label>Your name</label>
  <input type="text" id="sName">
  <label>Jarvis personality</label>
  <textarea id="sPersona"></textarea>
  <div class="row"><button id="sCancel" type="button">Cancel</button><button class="primary" id="sSave" type="button">Save</button></div>
</dialog>

<dialog id="memory">
  <h3 style="margin-top:0">What Jarvis remembers</h3>
  <small>One fact per line. Say "remember that..." to Jarvis, or edit here.</small>
  <label>Memories</label>
  <textarea id="mText" style="min-height:200px"></textarea>
  <div class="row"><button id="mCancel" type="button">Cancel</button><button class="primary" id="mSave" type="button">Save</button></div>
</dialog>

<script>
"use strict";

// ---------- storage helpers ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const DEFAULTS = {
  key: "",
  model: "gemini-3.8-flash",
  base: "https://generativelanguage.googleapis.com/v1beta/openai",
  fallbacks: "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.6-flash",
  name: "",
  persona: "You are Jarvis, a loyal, quick-witted personal AI assistant. Be concise, warm and a little dry-humoured. " +
           "Prefer short answers, especially since replies may be spoken aloud."
};
const cfg = () => ({ ...DEFAULTS, ...store.get("jarvis.cfg", {}) });
let memories = store.get("jarvis.memories", []);   // array of strings
let history  = store.get("jarvis.history", []);    // API-format messages
let speakOn  = store.get("jarvis.speak", false);

// ---------- UI ----------
const $ = id => document.getElementById(id);
const log = $("log");

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function renderHistory() {
  log.innerHTML = "";
  for (const m of history) {
    if (m.role === "user") add("me", m.content);
    else if (m.role === "assistant" && m.content) add("ai", m.content);
  }
  if (!history.length) add("sys", "Jarvis online. Open Settings and paste your API key to begin.");
}

// ---------- the orb: shows what Jarvis is doing ----------
const ORB_LABELS = { idle: "Standing by", listening: "Listening", thinking: "Thinking", speaking: "Speaking" };
let speaking = false;
function setState(s) {
  $("orb").className = s;
  $("orbLabel").textContent = ORB_LABELS[s] || "";
}

// ---------- speech out ----------
let currentUtterance = null;
function speak(text) {
  if (!speakOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const clean = text.replace(/[*_`#>]/g, "");
  const u = new SpeechSynthesisUtterance(clean);
  currentUtterance = u;
  u.onstart = () => { if (currentUtterance === u) { speaking = true; setState("speaking"); } };
  const done = () => { if (currentUtterance === u) { speaking = false; setState(busy ? "thinking" : "idle"); } };
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function paintSpeakBtn() {
  $("speakBtn").textContent = "Voice: " + (speakOn ? "on" : "off");
  $("speakBtn").classList.toggle("on", speakOn);
}
$("speakBtn").onclick = () => {
  speakOn = !speakOn; store.set("jarvis.speak", speakOn); paintSpeakBtn();
  if (!speakOn && "speechSynthesis" in window) { currentUtterance = null; speechSynthesis.cancel(); speaking = false; setState(busy ? "thinking" : "idle"); }
};

// ---------- speech in ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$("micBtn").onclick = () => {
  if (!SR) { add("sys", "Voice input needs Chrome or Edge."); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = navigator.language || "en-IN";
  rec.interimResults = false;
  rec.onstart = () => { $("micBtn").classList.add("rec"); setState("listening"); };
  rec.onend = () => { $("micBtn").classList.remove("rec"); rec = null; if (!busy && !speaking) setState("idle"); };
  rec.onerror = e => add("sys", "Mic error: " + e.error);
  rec.onresult = e => {
    const t = e.results[0][0].transcript;
    speakOn = true; store.set("jarvis.speak", true); paintSpeakBtn(); // talk to it, it talks back
    send(t);
  };
  rec.start();
};

// ---------- tools Jarvis can use ----------
const tools = [
  { type: "function", function: { name: "get_time",
      description: "Get the current local date and time.", parameters: { type: "object", properties: {} } } },
  { type: "function", function: { name: "open_website",
      description: "Open a website in a new browser tab.",
      parameters: { type: "object", properties: { url: { type: "string", description: "Full URL, e.g. https://youtube.com" } }, required: ["url"] } } },
  { type: "function", function: { name: "search_web",
      description: "Open a Google search for a query in a new tab.",
      parameters: { type: "object", properties: { query: { type: "string" } }, required: ["query"] } } },
  { type: "function", function: { name: "remember",
      description: "Save a fact about the user to long-term memory. Use when the user asks you to remember something.",
      parameters: { type: "object", properties: { fact: { type: "string" } }, required: ["fact"] } } },
  { type: "function", function: { name: "set_timer",
      description: "Set a timer that alerts the user when it ends.",
      parameters: { type: "object", properties: { seconds: { type: "number" }, label: { type: "string" } }, required: ["seconds"] } } }
];

const toolImpl = {
  get_time: () => new Date().toString(),
  open_website: ({ url }) => {
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    const w = window.open(url, "_blank", "noopener");
    return w ? "Opened " + url : "The browser blocked the popup. Ask the user to allow popups for this page.";
  },
  search_web: ({ query }) => {
    const w = window.open("https://www.google.com/search?q=" + encodeURIComponent(query), "_blank", "noopener");
    return w ? "Opened search for: " + query : "The browser blocked the popup. Ask the user to allow popups for this page.";
  },
  remember: ({ fact }) => {
    memories.push(fact); store.set("jarvis.memories", memories); return "Saved.";
  },
  set_timer: ({ seconds, label }) => {
    setTimeout(() => {
      const msg = "Timer finished" + (label ? ": " + label : "") + ".";
      add("ai", msg); speak(msg);
    }, Math.max(1, seconds) * 1000);
    return "Timer set for " + seconds + " seconds.";
  }
};

// ---------- talking to the model ----------
function systemPrompt() {
  const c = cfg();
  let s = c.persona;
  if (c.name) s += "\nThe user's name is " + c.name + ".";
  if (memories.length) s += "\nThings you remember about the user:\n- " + memories.join("\n- ");
  s += "\nCurrent time: " + new Date().toString();
  return s;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// One attempt with one model. Errors are tagged: e.retry = worth trying the same model again,
// e.next = worth trying the next backup model.
async function callOnce(c, model, messages) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 25000);   // never hang forever on "..."
  let res;
  try {
    res = await fetch(c.base.replace(/\/+$/, "") + "/chat/completions", {
      method: "POST",
      signal: ctl.signal,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + c.key },
      body: JSON.stringify({ model, messages, tools, tool_choice: "auto" })
    });
  } catch (err) {
    const e = new Error(err.name === "AbortError" ? "Timed out waiting for the model" : "Network problem: " + err.message);
    e.retry = e.next = true;
    throw e;
  } finally { clearTimeout(timer); }
  if (!res.ok) {
    let detail = ""; try { detail = (await res.json()).error?.message || ""; } catch {}
    const e = new Error("API error " + res.status + (detail ? ": " + detail : ""));
    if (res.status === 429 || res.status >= 500) e.retry = e.next = true;   // busy or rate limited
    else if (res.status === 404) e.next = true;                             // model name not available
    throw e;
  }
  return (await res.json()).choices[0].message;
}

async function callModel(messages, status) {
  const c = cfg();
  const models = [c.model, ...String(c.fallbacks || "").split(",").map(s => s.trim()).filter(Boolean)]
    .filter((m, i, a) => m && a.indexOf(m) === i);
  let lastErr;
  for (let i = 0; i < models.length; i++) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try { return await callOnce(c, models[i], messages); }
      catch (e) {
        lastErr = e;
        if (!e.next) throw e;                 // e.g. wrong key: retrying will not help
        if (e.retry && attempt === 0) {
          if (status) status("Model busy, retrying...");
          await sleep(2000);
        } else break;
      }
    }
    if (i < models.length - 1 && status) status("Switching to backup model " + models[i + 1] + "...");
  }
  throw lastErr;
}

let busy = false;
async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  if (!cfg().key) { add("sys", "Open Settings and paste your API key first."); return; }
  busy = true;
  setState("thinking");
  add("me", text);
  history.push({ role: "user", content: text });
  const thinking = add("sys", "...");
  try {
    for (let step = 0; step < 5; step++) {
      const msg = await callModel([{ role: "system", content: systemPrompt() }, ...history.slice(-30)],
                                  t => { thinking.textContent = t; });
      history.push(msg);
      if (msg.tool_calls && msg.tool_calls.length) {
        for (const call of msg.tool_calls) {
          let out;
          try {
            const args = JSON.parse(call.function.arguments || "{}");
            out = String(toolImpl[call.function.name] ? toolImpl[call.function.name](args) : "Unknown tool.");
          } catch (e) { out = "Tool failed: " + e.message; }
          history.push({ role: "tool", tool_call_id: call.id, content: out });
        }
        continue;
      }
      thinking.remove();
      add("ai", msg.content || "");
      speak(msg.content || "");
      break;
    }
  } catch (e) {
    thinking.remove();
    add("sys", "Something went wrong: " + e.message);
    // drop the unanswered turn so history stays valid
    while (history.length && history[history.length - 1].role !== "user") history.pop();
    history.pop();
  }
  history = history.slice(-60);
  store.set("jarvis.history", history);
  busy = false;
  if (!speaking && !(currentUtterance && speechSynthesis.pending)) setState("idle");
}

$("form").onsubmit = e => { e.preventDefault(); const t = $("box").value; $("box").value = ""; send(t); };

// ---------- settings + memory dialogs ----------
$("setBtn").onclick = () => {
  const c = cfg();
  $("sKey").value = c.key; $("sModel").value = c.model; $("sBase").value = c.base;
  $("sFallbacks").value = c.fallbacks;
  $("sName").value = c.name; $("sPersona").value = c.persona;
  $("settings").showModal();
};
$("sCancel").onclick = () => $("settings").close();
$("sSave").onclick = () => {
  store.set("jarvis.cfg", { key: $("sKey").value.trim(), model: $("sModel").value.trim() || DEFAULTS.model,
    base: $("sBase").value.trim() || DEFAULTS.base, fallbacks: $("sFallbacks").value.trim(),
    name: $("sName").value.trim(),
    persona: $("sPersona").value.trim() || DEFAULTS.persona });
  $("settings").close();
  add("sys", "Settings saved.");
};
$("memBtn").onclick = () => { $("mText").value = memories.join("\n"); $("memory").showModal(); };
$("mCancel").onclick = () => $("memory").close();
$("mSave").onclick = () => {
  memories = $("mText").value.split("\n").map(s => s.trim()).filter(Boolean);
  store.set("jarvis.memories", memories); $("memory").close();
};

paintSpeakBtn();
renderHistory();
</script>
</body>
</html>
