<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root {
    --bg:#03090f; --panel:rgba(7,22,32,.72); --line:rgba(56,217,255,.22); --text:#d5eef6; --dim:#6a8f9c;
    --c:#38d9ff; --ok:#5dffb0; --warn:#ffb84d;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  }
  body[data-state="listening"] { --c:#5dffb0; }
  body[data-state="thinking"]  { --c:#ffb84d; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; color:var(--text); font:15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; overflow:hidden;
         background:radial-gradient(ellipse at 50% 45%, #0a2230 0%, var(--bg) 62%); }

  #app { height:100%; display:grid; gap:14px; padding:14px;
         grid-template-columns:270px minmax(0,1fr) 270px; grid-template-rows:auto minmax(0,1fr) auto;
         grid-template-areas:"top top top" "left center right" ". form ."; }

  /* top bar */
  .top { grid-area:top; display:flex; align-items:center; gap:16px; padding:8px 14px;
         border:1px solid var(--line); background:var(--panel); }
  .brand { display:flex; align-items:center; gap:12px; flex:1; }
  .logo { width:30px; height:30px; background:var(--c); clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);
          box-shadow:0 0 14px var(--c); transition:background .4s; }
  .title { font:700 15px var(--mono); letter-spacing:4px; }
  .sub { font:10px var(--mono); letter-spacing:2px; color:var(--dim); text-transform:uppercase; }
  #clock { font:600 28px var(--mono); letter-spacing:3px; color:#eafcff; text-shadow:0 0 14px var(--c); }
  .actions { flex:1; display:flex; gap:8px; justify-content:flex-end; }
  button { font:inherit; }
  .actions button { background:transparent; border:1px solid var(--line); color:var(--dim); padding:6px 12px;
                    font:11px var(--mono); letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; }
  .actions button:hover, .actions button.on { color:var(--c); border-color:var(--c); }

  /* side panels */
  .col { display:flex; flex-direction:column; gap:14px; min-height:0; }
  .left { grid-area:left; } .right { grid-area:right; }
  .panel { border:1px solid var(--line); background:var(--panel); padding:12px 14px; min-height:0; display:flex; flex-direction:column; }
  .panel.grow { flex:1; }
  .ph { display:flex; align-items:center; font:11px var(--mono); letter-spacing:2.5px; text-transform:uppercase;
        color:var(--dim); margin-bottom:8px; }
  .ph::after { content:""; flex:1; height:1px; background:var(--line); margin-left:10px; }
  .rows { overflow-y:auto; min-height:0; }
  .row2 { display:flex; justify-content:space-between; gap:10px; font:12px var(--mono); padding:6px 0;
          border-bottom:1px solid rgba(56,217,255,.08); }
  .row2 .k { color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .row2 .v { text-align:right; word-break:break-word; }
  .ok { color:var(--ok); } .warn { color:var(--warn); }
  .empty { font:12px var(--mono); color:var(--dim); padding:6px 0; }
  .li { font:12px var(--mono); padding:6px 0; border-bottom:1px solid rgba(56,217,255,.08); word-break:break-word; }
  .li .t { color:var(--dim); margin-right:8px; }
  .panel .link { margin-top:8px; align-self:flex-start; background:none; border:0; color:var(--c); font:11px var(--mono);
                 letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; padding:0; }

  /* centre: sphere + conversation */
  .center { grid-area:center; display:flex; flex-direction:column; min-height:0; gap:10px; }
  .stage { flex:1 1 auto; min-height:170px; position:relative; }
  #sphere { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #orbLabel { position:absolute; left:0; right:0; bottom:4px; text-align:center; font:11px var(--mono);
              letter-spacing:3px; text-transform:uppercase; color:var(--dim); }
  #orbLabel::before { content:""; display:block; width:6px; height:6px; margin:0 auto 8px; border-radius:50%;
                      background:var(--c); box-shadow:0 0 10px var(--c); }
  #log { flex:0 1 auto; max-height:38%; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:4px 2px; }
  .msg { max-width:min(720px, 92%); padding:8px 13px; white-space:pre-wrap; word-wrap:break-word; }
  .me  { align-self:flex-end; background:rgba(56,217,255,.12); border:1px solid var(--line); }
  .ai  { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-left:2px solid var(--c); }
  .sys { align-self:center; color:var(--dim); font:12px var(--mono); letter-spacing:1px; }

  form { grid-area:form; display:flex; gap:8px; }
  form input { flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); color:var(--text); padding:11px 14px; font:inherit; outline:none; }
  form input:focus { border-color:var(--c); }
  form button { background:transparent; border:1px solid var(--c); color:var(--c); padding:0 18px; cursor:pointer;
                font:12px var(--mono); letter-spacing:2px; text-transform:uppercase; }
  form button:hover { background:rgba(56,217,255,.12); }
  form button.mic.rec { background:var(--c); color:#02131b; }

  /* dialogs */
  dialog { background:#071822; color:var(--text); border:1px solid var(--line); width:min(480px, 92vw); padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.65); }
  dialog h3 { margin:0 0 4px; font:13px var(--mono); letter-spacing:3px; text-transform:uppercase; color:var(--c); }
  dialog label { display:block; margin:12px 0 4px; color:var(--dim); font:11px var(--mono); letter-spacing:1px; text-transform:uppercase; }
  dialog input, dialog textarea { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; font:inherit; }
  dialog textarea { min-height:90px; }
  dialog small { color:var(--dim); }
  .drow { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .drow button { padding:8px 14px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  .drow button.primary { background:var(--c); color:#02131b; border-color:var(--c); font-weight:600; }

  /* small screens: just the sphere, chat and input */
  @media (max-width: 900px) {
    #app { grid-template-columns:minmax(0,1fr); grid-template-areas:"top" "center" "form"; padding:10px; gap:10px; }
    .col { display:none; }
    #clock { display:none; }
    .sub { display:none; }
    .top { gap:8px; padding:8px 10px; }
    .brand { flex:0 0 auto; }
    .title { display:none; }
    .actions { flex:1; gap:6px; }
    .actions button { flex:1; padding:7px 4px; font-size:10px; letter-spacing:1px; white-space:nowrap; }
    .stage { min-height:150px; }
    #log { max-height:48%; }
  }
</style>
</head>
<body data-state="idle">
<div id="app">
  <header class="top">
    <div class="brand"><div class="logo"></div><div><div class="title">JARVIS</div><div class="sub">Personal AI &middot; Live</div></div></div>
    <div id="clock">--:--:--</div>
    <div class="actions">
      <button id="speakBtn" title="Speak replies aloud">Voice: off</button>
      <button id="memBtn">Memory</button>
      <button id="setBtn">Settings</button>
    </div>
  </header>

  <aside class="col left">
    <section class="panel"><div class="ph">System vitals</div><div id="vitals"></div></section>
    <section class="panel grow"><div class="ph">Timers</div><div class="rows" id="timers"></div></section>
  </aside>

  <main class="center">
    <div class="stage"><canvas id="sphere"></canvas><div id="orbLabel">Standing by</div></div>
    <div id="log"></div>
  </main>

  <aside class="col right">
    <section class="panel grow"><div class="ph">Memory</div><div class="rows" id="memList"></div>
      <button class="link" id="memEdit" type="button">Edit memory</button></section>
    <section class="panel grow"><div class="ph">Activity</div><div class="rows" id="activity"></div></section>
  </aside>

  <form id="form">
    <button type="button" class="mic" id="micBtn" title="Talk to Jarvis">Mic</button>
    <input type="text" id="box" placeholder="Talk to Jarvis..." autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<dialog id="settings">
  <h3>Settings</h3>
  <label>API key (stored only in this browser)</label>
  <input type="password" id="sKey" placeholder="paste your key">
  <label>Model</label>
  <input type="text" id="sModel">
  <label>API base URL (any OpenAI-compatible service)</label>
  <input type="text" id="sBase">
  <label>Backup models (tried in order if the main one is busy; separate with commas)</label>
  <input type="text" id="sFallbacks">
  <small>Default is Google Gemini. Change the model, base URL and backups to switch provider later.</small>
  <div style="margin-top:8px"><button id="sLocal" type="button" style="padding:6px 10px;border:1px solid var(--line);background:var(--bg);color:var(--c);cursor:pointer">Use local model (Ollama, works offline)</button></div>
  <label>Your name</label>
  <input type="text" id="sName">
  <label>Jarvis personality</label>
  <textarea id="sPersona"></textarea>
  <div class="drow"><button id="sCancel" type="button">Cancel</button><button class="primary" id="sSave" type="button">Save</button></div>
</dialog>

<dialog id="memory">
  <h3>What Jarvis remembers</h3>
  <small>One fact per line. Say "remember that..." to Jarvis, or edit here.</small>
  <label>Memories</label>
  <textarea id="mText" style="min-height:200px"></textarea>
  <div class="drow"><button id="mCancel" type="button">Cancel</button><button class="primary" id="mSave" type="button">Save</button></div>
</dialog>

<script>
"use strict";

// ---------- storage helpers ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const DEFAULTS = {
  key: "",
  model: "gemini-3.8-flash",
  base: "https://generativelanguage.googleapis.com/v1beta/openai",
  fallbacks: "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.6-flash",
  name: "",
  persona: "You are Jarvis, a loyal, quick-witted personal AI assistant. Be concise, warm and a little dry-humoured. " +
           "Prefer short answers, especially since replies may be spoken aloud."
};
const cfg = () => ({ ...DEFAULTS, ...store.get("jarvis.cfg", {}) });
let memories = store.get("jarvis.memories", []);   // array of strings
let history  = store.get("jarvis.history", []);    // API-format messages
let speakOn  = store.get("jarvis.speak", false);

// ---------- UI helpers ----------
const $ = id => document.getElementById(id);
const log = $("log");
const clock24 = d => d.toLocaleTimeString("en-GB");

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function renderHistory() {
  log.innerHTML = "";
  for (const m of history) {
    if (m.role === "user") add("me", m.content);
    else if (m.role === "assistant" && m.content) add("ai", m.content);
  }
  if (!history.length) add("sys", "Jarvis online. Open Settings and paste your API key to begin.");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ---------- side panels (all real data) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const activityLog = [];     // newest first
const timersList = [];      // { label, end }

function renderVitals() {
  const c = cfg();
  const rows = [
    ["Brain", c.model, ""],
    ["Link", c.key ? "Key set" : "No key", c.key ? "ok" : "warn"],
    ["Voice out", speakOn ? "On" : "Off", speakOn ? "ok" : ""],
    ["Voice in", SR ? "Ready" : "Needs Chrome/Edge", SR ? "ok" : "warn"],
    ["Memory", memories.length + (memories.length === 1 ? " fact" : " facts"), ""],
    ["Messages", String(history.filter(m => m.role === "user").length), ""]
  ];
  const box = $("vitals");
  box.innerHTML = "";
  for (const [k, v, cls] of rows) {
    const r = el("div", "row2");
    r.append(el("span", "k", k), el("span", "v " + cls, v));
    box.append(r);
  }
}

function renderMemList() {
  const box = $("memList");
  box.innerHTML = "";
  if (!memories.length) { box.append(el("div", "empty", "Nothing yet. Say \"remember that...\"")); return; }
  for (const m of memories) box.append(el("div", "li", m));
}

function renderActivity() {
  const box = $("activity");
  box.innerHTML = "";
  if (!activityLog.length) { box.append(el("div", "empty", "No activity yet.")); return; }
  for (const a of activityLog) {
    const r = el("div", "li");
    r.append(el("span", "t", a.t), document.createTextNode(a.text));
    box.append(r);
  }
}
function logActivity(text) {
  activityLog.unshift({ t: clock24(new Date()), text });
  if (activityLog.length > 20) activityLog.pop();
  renderActivity();
}

function renderTimers() {
  const box = $("timers");
  box.innerHTML = "";
  if (!timersList.length) { box.append(el("div", "empty", "No active timers.")); return; }
  const now = Date.now();
  for (const t of timersList) {
    const left = Math.max(0, Math.ceil((t.end - now) / 1000));
    const mm = String(Math.floor(left / 60)).padStart(2, "0"), ss = String(left % 60).padStart(2, "0");
    const r = el("div", "row2");
    r.append(el("span", "k", t.label || "Timer"), el("span", "v", mm + ":" + ss));
    box.append(r);
  }
}

function tickClock() { $("clock").textContent = clock24(new Date()); renderTimers(); }
setInterval(tickClock, 500);

// ---------- the sphere: shows what Jarvis is doing ----------
const ORB_LABELS = { idle: "Standing by", listening: "Listening", thinking: "Thinking", speaking: "Speaking" };
const STATES = {
  idle:      { c: [56, 217, 255], spin: .12, hz: .35, amp: .035, jit: 0 },
  listening: { c: [93, 255, 176], spin: .30, hz: 1.1, amp: .09,  jit: .01 },
  thinking:  { c: [255, 184, 77], spin: 1.1, hz: 2.0, amp: .05,  jit: .02 },
  speaking:  { c: [56, 217, 255], spin: .35, hz: 3.2, amp: .12,  jit: .015 }
};
let speaking = false;
let target = STATES.idle;
const cur = { c: [...STATES.idle.c], spin: .12, hz: .35, amp: .035, jit: 0 };

function setState(s) {
  target = STATES[s] || STATES.idle;
  document.body.dataset.state = s;
  $("orbLabel").textContent = "Voice link · " + (ORB_LABELS[s] || "");
}

const cv = $("sphere"), ctx = cv.getContext("2d");
let W = 0, H = 0;
function resizeCanvas() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
if ("ResizeObserver" in window) new ResizeObserver(resizeCanvas).observe(cv);
window.addEventListener("resize", resizeCanvas);

const N = 750, PHI = Math.PI * (3 - Math.sqrt(5));
const pts = Array.from({ length: N }, (_, i) => {
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = PHI * i;
  return { x: Math.cos(th) * r, y, z: Math.sin(th) * r, s: .5 + Math.random() * 1.1 };
});
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let angle = 0, ringAngle = 0, last = performance.now();

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = now / 1000, k = Math.min(1, dt * 4), m = reduce ? .15 : 1;
  for (let i = 0; i < 3; i++) cur.c[i] += (target.c[i] - cur.c[i]) * k;
  cur.spin += (target.spin - cur.spin) * k; cur.hz += (target.hz - cur.hz) * k;
  cur.amp += (target.amp - cur.amp) * k; cur.jit += (target.jit - cur.jit) * k;
  angle += cur.spin * dt * m; ringAngle -= .05 * dt * m;

  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2 - 6, base = Math.min(W * .5, H * 1.0) * .27;
  const R = base * (1 + cur.amp * Math.sin(Math.PI * 2 * cur.hz * t) * m);
  const [cr, cg, cb] = cur.c.map(Math.round), col = a => `rgba(${cr},${cg},${cb},${a})`;

  // faint outer rings and tick ring
  ctx.lineWidth = 1;
  ctx.strokeStyle = col(.14);
  for (const f of [1.4, 1.78]) { ctx.beginPath(); ctx.arc(cx, cy, base * f, 0, Math.PI * 2); ctx.stroke(); }
  ctx.fillStyle = col(.55);
  for (let i = 0; i < 120; i++) {
    const a = ringAngle + (i / 120) * Math.PI * 2, rr = base * 1.6;
    ctx.fillRect(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, i % 5 === 0 ? 2.4 : 1.2, i % 5 === 0 ? 2.4 : 1.2);
  }

  // particle sphere
  const ca = Math.cos(angle), sa = Math.sin(angle), tilt = .38, ct = Math.cos(tilt), st = Math.sin(tilt);
  for (let i = 0; i < N; i++) {
    const p = pts[i];
    let x = p.x * ca + p.z * sa, z = -p.x * sa + p.z * ca, y = p.y;
    const y2 = y * ct - z * st, z2 = y * st + z * ct;
    const persp = 1 / (1 - z2 * .28);
    let sx = cx + x * R * persp, sy = cy + y2 * R * persp;
    if (cur.jit > .0005) { sx += (Math.random() - .5) * cur.jit * R; sy += (Math.random() - .5) * cur.jit * R; }
    const depth = (z2 + 1) / 2;
    ctx.fillStyle = col(.18 + .82 * depth);
    const sz = p.s * persp * (.8 + depth * .8);
    ctx.fillRect(sx, sy, sz, sz);
  }

  // glowing core
  const gr = R * .33 * (1 + cur.amp * .8 * Math.sin(Math.PI * 2 * cur.hz * t) * m);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr * 2.4);
  g.addColorStop(0, "rgba(255,255,255,.95)"); g.addColorStop(.25, col(.9)); g.addColorStop(.6, col(.25)); g.addColorStop(1, col(0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, gr * 2.4, 0, Math.PI * 2); ctx.fill();

  requestAnimationFrame(frame);
}
resizeCanvas();
requestAnimationFrame(frame);

// ---------- speech out ----------
let currentUtterance = null;
function speak(text) {
  if (!speakOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const clean = text.replace(/[*_`#>]/g, "");
  const u = new SpeechSynthesisUtterance(clean);
  currentUtterance = u;
  u.onstart = () => { if (currentUtterance === u) { speaking = true; setState("speaking"); } };
  const done = () => { if (currentUtterance === u) { speaking = false; setState(busy ? "thinking" : "idle"); } };
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function paintSpeakBtn() {
  $("speakBtn").textContent = "Voice: " + (speakOn ? "on" : "off");
  $("speakBtn").classList.toggle("on", speakOn);
  renderVitals();
}
$("speakBtn").onclick = () => {
  speakOn = !speakOn; store.set("jarvis.speak", speakOn); paintSpeakBtn();
  if (!speakOn && "speechSynthesis" in window) {
    currentUtterance = null; speechSynthesis.cancel(); speaking = false; setState(busy ? "thinking" : "idle");
  }
};

// ---------- speech in ----------
let rec = null;
$("micBtn").onclick = () => {
  if (!SR) { add("sys", "Voice input needs Chrome or Edge."); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = navigator.language || "en-IN";
  rec.interimResults = false;
  rec.onstart = () => { $("micBtn").classList.add("rec"); setState("listening"); };
  rec.onend = () => { $("micBtn").classList.remove("rec"); rec = null; if (!busy && !speaking) setState("idle"); };
  rec.onerror = e => add("sys", "Mic error: " + e.error);
  rec.onresult = e => {
    const t = e.results[0][0].transcript;
    speakOn = true; store.set("jarvis.speak", true); paintSpeakBtn(); // talk to it, it talks back
    send(t);
  };
  rec.start();
};

// ---------- tools Jarvis can use ----------
const tools = [
  { type: "function", function: { name: "get_time",
      description: "Get the current local date and time.", parameters: { type: "object", properties: {} } } },
  { type: "function", function: { name: "open_website",
      description: "Open a website in a new browser tab.",
      parameters: { type: "object", properties: { url: { type: "string", description: "Full URL, e.g. https://youtube.com" } }, required: ["url"] } } },
  { type: "function", function: { name: "search_web",
      description: "Open a Google search for a query in a new tab.",
      parameters: { type: "object", properties: { query: { type: "string" } }, required: ["query"] } } },
  { type: "function", function: { name: "remember",
      description: "Save a fact about the user to long-term memory. Use when the user asks you to remember something.",
      parameters: { type: "object", properties: { fact: { type: "string" } }, required: ["fact"] } } },
  { type: "function", function: { name: "set_timer",
      description: "Set a timer that alerts the user when it ends.",
      parameters: { type: "object", properties: { seconds: { type: "number" }, label: { type: "string" } }, required: ["seconds"] } } }
];

const toolImpl = {
  get_time: () => new Date().toString(),
  open_website: ({ url }) => {
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    const w = window.open(url, "_blank", "noopener");
    return w ? "Opened " + url : "The browser blocked the popup. Ask the user to allow popups for this page.";
  },
  search_web: ({ query }) => {
    const w = window.open("https://www.google.com/search?q=" + encodeURIComponent(query), "_blank", "noopener");
    return w ? "Opened search for: " + query : "The browser blocked the popup. Ask the user to allow popups for this page.";
  },
  remember: ({ fact }) => {
    memories.push(fact); store.set("jarvis.memories", memories); renderMemList(); renderVitals(); return "Saved.";
  },
  set_timer: ({ seconds, label }) => {
    const secs = Math.max(1, Number(seconds) || 1);
    const entry = { label: label || "Timer", end: Date.now() + secs * 1000 };
    timersList.push(entry); renderTimers();
    setTimeout(() => {
      const i = timersList.indexOf(entry); if (i >= 0) timersList.splice(i, 1);
      const msg = "Timer finished" + (label ? ": " + label : "") + ".";
      add("ai", msg); speak(msg); logActivity(msg); renderTimers();
    }, secs * 1000);
    return "Timer set for " + secs + " seconds.";
  }
};

// ---------- talking to the model ----------
function systemPrompt() {
  const c = cfg();
  let s = c.persona;
  if (c.name) s += "\nThe user's name is " + c.name + ".";
  if (memories.length) s += "\nThings you remember about the user:\n- " + memories.join("\n- ");
  s += "\nCurrent time: " + new Date().toString();
  return s;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Read a streamed (server-sent events) reply, calling onToken with the text so far.
async function readStream(res, onToken, bump) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", content = "", calls = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    bump();
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      const data = line.slice(5).trim();
      if (data === "[DONE]") continue;
      let j; try { j = JSON.parse(data); } catch { continue; }
      const d = j.choices && j.choices[0] && j.choices[0].delta;
      if (!d) continue;
      if (d.content) { content += d.content; if (onToken) onToken(content); }
      for (const tc of d.tool_calls || []) {
        let call;
        if (tc.index !== undefined && calls[tc.index]) call = calls[tc.index];
        else if ((tc.function && tc.function.name) || tc.id) {
          call = { id: tc.id || "", type: "function", function: { name: "", arguments: "" } };
          if (tc.index !== undefined) calls[tc.index] = call; else calls.push(call);
        } else call = calls[calls.length - 1];
        if (!call) continue;
        if (tc.id) call.id = tc.id;
        if (tc.function && tc.function.name) call.function.name = tc.function.name;
        if (tc.function && tc.function.arguments) call.function.arguments += tc.function.arguments;
      }
    }
  }
  calls = calls.filter(Boolean);
  calls.forEach((c, i) => { if (!c.id) c.id = "call_" + Date.now() + "_" + i; });
  if (!content && !calls.length) { const e = new Error("Empty reply from the model"); e.parse = true; throw e; }   // try again without streaming
  const msg = { role: "assistant", content: content || null };
  if (calls.length) msg.tool_calls = calls;
  return msg;
}

// One attempt with one model. Errors are tagged: e.retry = worth trying the same model again,
// e.next = worth trying the next backup model, e.parse = streaming itself broke (try without it).
async function callOnce(c, model, messages, onToken, stream) {
  const ctl = new AbortController();
  let timer = setTimeout(() => ctl.abort(), 25000);     // never hang forever on "..."
  const bump = () => { clearTimeout(timer); timer = setTimeout(() => ctl.abort(), 25000); };
  const timeoutErr = () => { const e = new Error("Timed out waiting for the model"); e.retry = e.next = true; return e; };
  let res;
  try {
    res = await fetch(c.base.replace(/\/+$/, "") + "/chat/completions", {
      method: "POST",
      signal: ctl.signal,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + c.key },
      body: JSON.stringify({ model, messages, tools, tool_choice: "auto", stream })
    });
  } catch (err) {
    clearTimeout(timer);
    if (err.name === "AbortError") throw timeoutErr();
    const e = new Error("Network problem: " + err.message); e.retry = e.next = true; throw e;
  }
  if (!res.ok) {
    clearTimeout(timer);
    let detail = ""; try { detail = (await res.json()).error?.message || ""; } catch {}
    const e = new Error("API error " + res.status + (detail ? ": " + detail : ""));
    if (res.status === 429 || res.status >= 500) e.retry = e.next = true;   // busy or rate limited
    else if (res.status === 404) e.next = true;                             // model name not available
    throw e;
  }
  try {
    if (!stream) return (await res.json()).choices[0].message;
    return await readStream(res, onToken, bump);
  } catch (err) {
    if (err.retry || err.next) throw err;
    if (err.name === "AbortError") throw timeoutErr();
    err.parse = true; throw err;
  } finally { clearTimeout(timer); }
}

async function callModel(messages, status, onToken) {
  const c = cfg();
  const models = [c.model, ...String(c.fallbacks || "").split(",").map(s => s.trim()).filter(Boolean)]
    .filter((m, i, a) => m && a.indexOf(m) === i);
  let lastErr, stream = true;
  for (let i = 0; i < models.length; i++) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try { return await callOnce(c, models[i], messages, onToken, stream); }
      catch (e) {
        lastErr = e;
        if (e.parse && stream) { stream = false; attempt--; continue; }   // streaming broke: retry plainly
        if (!e.next) throw e;                 // e.g. wrong key: retrying will not help
        if (e.retry && attempt === 0) {
          if (status) status("Model busy, retrying...");
          await sleep(2000);
        } else break;
      }
    }
    if (i < models.length - 1 && status) status("Switching to backup model " + models[i + 1] + "...");
  }
  throw lastErr;
}

let busy = false;
async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  if (!cfg().key) { add("sys", "Open Settings and paste your API key first."); return; }
  busy = true;
  setState("thinking");
  add("me", text);
  history.push({ role: "user", content: text });
  renderVitals();
  const thinking = add("sys", "...");
  try {
    for (let step = 0; step < 5; step++) {
      let bubble = null;   // the reply appears word by word as it streams in
      const msg = await callModel([{ role: "system", content: systemPrompt() }, ...history.slice(-30)],
                                  t => { thinking.textContent = t; logActivity(t); },
                                  text => {
                                    if (!bubble) { thinking.remove(); bubble = add("ai", text); }
                                    else { bubble.textContent = text; log.scrollTop = log.scrollHeight; }
                                  });
      history.push(msg);
      if (msg.tool_calls && msg.tool_calls.length) {
        for (const call of msg.tool_calls) {
          let out;
          try {
            const args = JSON.parse(call.function.arguments || "{}");
            logActivity("Tool: " + call.function.name + " " + (Object.values(args)[0] ?? ""));
            out = String(toolImpl[call.function.name] ? toolImpl[call.function.name](args) : "Unknown tool.");
          } catch (e) { out = "Tool failed: " + e.message; }
          history.push({ role: "tool", tool_call_id: call.id, content: out });
        }
        continue;
      }
      thinking.remove();
      if (bubble) bubble.textContent = msg.content || ""; else add("ai", msg.content || "");
      speak(msg.content || "");
      break;
    }
  } catch (e) {
    thinking.remove();
    add("sys", "Something went wrong: " + e.message);
    logActivity("Error: " + e.message);
    // drop the unanswered turn so history stays valid
    while (history.length && history[history.length - 1].role !== "user") history.pop();
    history.pop();
  }
  history = history.slice(-60);
  store.set("jarvis.history", history);
  busy = false;
  renderVitals();
  if (!speaking && !(currentUtterance && speechSynthesis.pending)) setState("idle");
}

$("form").onsubmit = e => { e.preventDefault(); const t = $("box").value; $("box").value = ""; send(t); };

// ---------- settings + memory dialogs ----------
$("setBtn").onclick = () => {
  const c = cfg();
  $("sKey").value = c.key; $("sModel").value = c.model; $("sBase").value = c.base;
  $("sFallbacks").value = c.fallbacks;
  $("sName").value = c.name; $("sPersona").value = c.persona;
  $("settings").showModal();
};
$("sCancel").onclick = () => $("settings").close();
$("sLocal").onclick = () => {
  $("sBase").value = "http://localhost:11434/v1";
  $("sFallbacks").value = "";
  if (!$("sKey").value.trim()) $("sKey").value = "ollama";   // local servers ignore the key; Jarvis just needs something here
  if (!$("sModel").value.trim() || $("sModel").value.startsWith("gemini")) $("sModel").value = "";
  $("sModel").placeholder = "type the model name you pulled in Ollama";
  $("sModel").focus();
};
$("sSave").onclick = () => {
  store.set("jarvis.cfg", { key: $("sKey").value.trim(), model: $("sModel").value.trim() || DEFAULTS.model,
    base: $("sBase").value.trim() || DEFAULTS.base, fallbacks: $("sFallbacks").value.trim(),
    name: $("sName").value.trim(),
    persona: $("sPersona").value.trim() || DEFAULTS.persona });
  $("settings").close();
  add("sys", "Settings saved.");
  renderVitals();
};
const openMemory = () => { $("mText").value = memories.join("\n"); $("memory").showModal(); };
$("memBtn").onclick = openMemory;
$("memEdit").onclick = openMemory;
$("mCancel").onclick = () => $("memory").close();
$("mSave").onclick = () => {
  memories = $("mText").value.split("\n").map(s => s.trim()).filter(Boolean);
  store.set("jarvis.memories", memories); $("memory").close();
  renderMemList(); renderVitals();
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

setState("idle");
paintSpeakBtn();
renderHistory();
renderMemList();
renderActivity();
renderTimers();
tickClock();
</script>
